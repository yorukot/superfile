name: Website CI

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      # files outside website/ that the site reads at build time
      - "src/superfile_config/**"
      - "cd_on_quit/**"
      - "NOTICE.md"
      - "SECURITY.md"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      # files outside website/ that the site reads at build time
      - "src/superfile_config/**"
      - "cd_on_quit/**"
      - "NOTICE.md"
      - "SECURITY.md"

permissions:
  contents: read

jobs:
  checks:
    name: Prettier and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # the build reads the docs of released versions from their tags
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build website
        run: pnpm build
