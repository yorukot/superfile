###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "solarized-light"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#657b83"
full_screen_bg = "#fdf6e3"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#b58900", "#cb4b16"]

#-- File Panel
file_panel_fg = "#657b83"
file_panel_bg = "#fdf6e3"
file_panel_border = "#657b83"
file_panel_border_active = "#268bd2"
file_panel_top_directory_icon = "#93a1a1"
file_panel_top_path = "#2aa198"
file_panel_item_selected_fg = "#268bd2"
file_panel_item_selected_bg = "#fdf6e3"

#-- Footer
footer_fg = "#657b83"
footer_bg = "#fdf6e3"
footer_border = "#b58900"
footer_border_active = "#cb4b16"

#-- Sidebar
sidebar_fg = "#657b83"
sidebar_bg = "#fdf6e3"
sidebar_title = "#d33682"
sidebar_border = "#6c71c4"
sidebar_border_active = "#d33682"
sidebar_item_selected_fg = "#fdf6e3"
sidebar_item_selected_bg = "#657b83"
sidebar_divider = "#93a1a1"

#-- Modals
modal_fg = "#657b83"
modal_bg = "#fdf6e3"
modal_border_active = "#859900"
modal_cancel_fg = "#dc322f"
modal_cancel_bg = "#fdf6e3"
modal_confirm_fg = "#859900"
modal_confirm_bg = "#fdf6e3"

#-- Help Menu
help_menu_hotkey = "#2aa198"
help_menu_title = "#268bd2"

#-- Special
cursor = "#93a1a1"
correct = "#268bd2"
error = "#dc322f"
hint = "#268bd2"
cancel = "#b58900"
